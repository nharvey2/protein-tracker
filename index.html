<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Protein">
  <meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1310" media="(prefers-color-scheme: dark)">
  <title>Protein</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="intro">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">&gt;_</span>
      <span>Protein Tracker</span>
    </div>
    <button id="goalBtn" class="outline-btn goal-btn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><circle cx="8" cy="8" r="3.5"/><circle cx="8" cy="8" r=".8" class="fill"/></svg>
      Set goal <span class="muted">(<span id="goalGrams">150</span>g)</span>
    </button>
  </header>

  <main class="app">
    <section class="hero">
      <h1 class="pixel-title">PROTEIN</h1>
      <div class="day-nav">
        <button id="prevDay" class="icon-btn" aria-label="Previous day">‹</button>
        <p class="status"><span id="statusDot" class="dot"></span><span id="dayLabel">Today</span> · <span id="remaining"></span></p>
        <button id="nextDay" class="icon-btn" aria-label="Next day">›</button>
      </div>

      <div class="gauge">
        <div class="cylinder">
          <div class="scale" aria-hidden="true">
            <span id="scaleTop">150</span>
            <span id="scaleMid">75</span>
            <span>0</span>
          </div>
          <div id="tube" class="tube empty" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="liquid" class="liquid">
              <svg class="wave wave-back" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 10 Q25 2 50 10 T100 10 T150 10 T200 10 V20 H0 Z"/>
              </svg>
              <svg class="wave wave-front" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 10 Q25 18 50 10 T100 10 T150 10 T200 10 V20 H0 Z"/>
              </svg>
              <div class="bubbles" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
              </div>
            </div>
            <div class="ticks" aria-hidden="true"></div>
            <div class="glass" aria-hidden="true"></div>
          </div>
          <div id="fx" class="fx" aria-hidden="true"></div>
        </div>

        <div class="readout">
          <span class="label">Eaten</span>
          <div class="big"><b id="totalGrams">0</b><span>g</span></div>
          <div id="pct" class="pct">0%</div>
          <dl>
            <div><dt>Goal</dt><dd><span id="goalStat">150</span>g</dd></div>
            <div><dt>Left</dt><dd><span id="leftStat">150</span>g</dd></div>
            <div><dt>Meals</dt><dd id="mealStat">0</dd></div>
          </dl>
        </div>
      </div>
    </section>

    <form id="addForm" class="add-form" autocomplete="off">
      <label class="prompt-input">
        <span class="caret" aria-hidden="true">&gt;</span>
        <input id="foodInput" type="text" placeholder="Food (e.g. chicken breast)" enterkeyhint="next" list="foodSuggestions">
      </label>
      <datalist id="foodSuggestions"></datalist>
      <div class="add-row">
        <input id="gramsInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Protein (g)" enterkeyhint="done" required>
        <button type="submit" class="primary">+ Add</button>
      </div>
    </form>

    <section id="quickSection" hidden>
      <h2>Quick add</h2>
      <div id="quickList" class="chips"></div>
    </section>

    <section>
      <h2>Entries <span id="entryCount" class="count">0</span></h2>
      <ul id="entryList" class="entries"></ul>
      <p id="emptyMsg" class="empty">// nothing logged yet</p>
    </section>

    <section>
      <h2>Last 7 days</h2>
      <div id="weekChart" class="week"></div>
    </section>
  </main>

  <dialog id="goalDialog" class="sheet">
    <form method="dialog" id="goalForm">
      <div class="grabber" aria-hidden="true"></div>
      <h2>Daily goal</h2>
      <p class="sheet-sub">How much protein are you aiming for each day?</p>

      <div class="stepper">
        <button type="button" class="step-btn" data-step="-5" aria-label="Decrease by 5 grams">−</button>
        <label class="goal-value">
          <input id="goalInput" type="number" inputmode="numeric" min="10" max="500" step="1" aria-label="Daily goal in grams">
          <span>g</span>
        </label>
        <button type="button" class="step-btn" data-step="5" aria-label="Increase by 5 grams">+</button>
      </div>
      <p id="goalDelta" class="goal-delta">&nbsp;</p>

      <div id="goalPresets" class="presets"></div>

      <div class="dialog-actions">
        <button value="cancel" type="submit" class="outline-btn" formnovalidate>Cancel</button>
        <button value="save" type="submit" class="primary" formnovalidate>Save goal</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
