<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Protein">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <title>Protein</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">&gt;_</span>
      <span>Protein Tracker</span>
    </div>
    <button id="goalBtn" class="outline-btn">goal <span id="goalGrams">150</span>g</button>
  </header>

  <main class="app">
    <section class="hero">
      <h1 class="pixel-title">PROTEIN</h1>
      <div class="day-nav">
        <button id="prevDay" class="icon-btn" aria-label="Previous day">‹</button>
        <p class="status"><span id="statusDot" class="dot"></span><span id="dayLabel">Today</span> · <span id="remaining"></span></p>
        <button id="nextDay" class="icon-btn" aria-label="Next day">›</button>
      </div>

      <div class="stats">
        <div><b id="totalGrams">0</b><span>Eaten</span></div>
        <div><b id="goalStat">150</b><span>Goal</span></div>
        <div><b id="leftStat">150</b><span>Left</span></div>
      </div>
      <div id="blockBar" class="block-bar" aria-hidden="true"></div>
    </section>

    <form id="addForm" class="add-form" autocomplete="off">
      <label class="prompt-input">
        <span class="caret" aria-hidden="true">&gt;</span>
        <input id="foodInput" type="text" placeholder="Food (e.g. chicken breast)" enterkeyhint="next" list="foodSuggestions">
      </label>
      <datalist id="foodSuggestions"></datalist>
      <div class="add-row">
        <input id="gramsInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Protein (g)" enterkeyhint="done" required>
        <button type="submit" class="primary">+ Add</button>
      </div>
    </form>

    <section id="quickSection" hidden>
      <h2>Quick add</h2>
      <div id="quickList" class="chips"></div>
    </section>

    <section>
      <h2>Entries <span id="entryCount" class="count">0</span></h2>
      <ul id="entryList" class="entries"></ul>
      <p id="emptyMsg" class="empty">// nothing logged yet</p>
    </section>

    <section>
      <h2>Last 7 days</h2>
      <div id="weekChart" class="week"></div>
    </section>
  </main>

  <dialog id="goalDialog">
    <form method="dialog" id="goalForm">
      <h2>Daily goal</h2>
      <label class="prompt-input">
        <span class="caret" aria-hidden="true">&gt;</span>
        <input id="goalInput" type="number" inputmode="numeric" min="1" step="1">
        <span class="suffix">g</span>
      </label>
      <div class="dialog-actions">
        <button value="cancel" type="submit" class="outline-btn">Cancel</button>
        <button value="save" type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
